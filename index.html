<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#104b37">
<title>رفيق الحافظ</title>
<style>
:root{--green:#104b37;--green2:#176b48;--mint:#e8f2eb;--bg:#f3f6f3;--ink:#20352a;--muted:#718076;--line:#e3eae4;--white:#fff;--gold:#c49b38;--red:#b94b4b;--blue:#386c9e;--shadow:0 8px 24px rgba(25,60,40,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Tahoma,Arial,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{max-width:1120px;margin:auto;min-height:100vh;background:var(--bg)}.top{background:var(--green);color:white;padding:20px 22px 16px;border-radius:0 0 22px 22px}.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:14px;background:#ffffff1c;display:grid;place-items:center;font-size:25px}.brand h1{font-size:21px;margin:0 0 4px}.brand small{color:#d3e5d9}.userline{display:flex;align-items:center;justify-content:space-between;margin-top:20px}.userline small{color:#d3e5d9}.role-pill{background:#ffffff1c;border:1px solid #ffffff35;border-radius:30px;padding:7px 12px;font-size:12px}.nav{display:flex;gap:8px;padding:14px 16px;overflow:auto;position:sticky;top:0;background:var(--bg);z-index:5}.nav button{white-space:nowrap;background:white;border:1px solid var(--line);color:#476052;padding:10px 14px;border-radius:12px;font-size:13px}.nav button.active{background:var(--green2);color:white;border-color:var(--green2)}main{padding:4px 16px 34px}.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:10px 0 18px}.pagehead h2{margin:0 0 5px;font-size:22px;color:var(--green)}.sub{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow)}.stat{display:flex;justify-content:space-between;align-items:center}.stat .num{font-size:27px;font-weight:bold;color:var(--green)}.stat .ico{width:40px;height:40px;border-radius:13px;background:var(--mint);display:grid;place-items:center;font-size:20px}.stat small,.muted{color:var(--muted)}.section{margin-top:16px}.section h3{font-size:16px;margin:0 0 12px;color:var(--green)}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.list{display:flex;flex-direction:column;gap:9px}.item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--mint);color:var(--green);display:grid;place-items:center;font-weight:bold}.item .grow{flex:1;min-width:0}.item strong{display:block;font-size:14px}.item small{display:block;color:var(--muted);font-size:12px;margin-top:4px}.badge{display:inline-block;border-radius:30px;padding:5px 9px;font-size:11px;background:#edf3ee;color:var(--green)}.badge.ok{background:#e4f4e9;color:#176b48}.badge.warn{background:#fff3dc;color:#93651a}.badge.bad{background:#fbeaea;color:#a43e3e}.btn{background:var(--green2);color:white;padding:11px 15px;border-radius:11px;font-size:13px}.btn.secondary{background:white;color:var(--green);border:1px solid var(--line)}.btn.gold{background:var(--gold);color:#fff}.btn.danger{background:var(--red)}.btn.small{padding:8px 10px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.field{margin:12px 0}.field label{display:block;font-size:13px;color:#52665a;margin-bottom:7px}.field input,.field select,.field textarea,.search{width:100%;border:1px solid #dce5de;background:#fff;border-radius:11px;padding:12px;color:var(--ink);outline:none}.field textarea{min-height:88px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green2);box-shadow:0 0 0 3px #176b4814}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}.empty{text-align:center;color:var(--muted);padding:25px 10px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:right;padding:12px 10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:normal;background:#fafcfb}.progress{height:8px;background:#e8eee9;border-radius:20px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green2);border-radius:20px}.notice{padding:12px;border-radius:12px;background:#edf5ef;color:#315c43;font-size:13px;margin:10px 0}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{padding:8px 12px;border:1px solid var(--line);background:white;border-radius:10px;color:#52665a;font-size:12px}.tabs button.active{background:var(--mint);border-color:#b8d4c0;color:var(--green)}.chat{display:flex;flex-direction:column;gap:10px}.bubble{max-width:85%;padding:11px 13px;border-radius:14px;background:#f1f4f1;font-size:13px;line-height:1.7}.bubble.mine{align-self:flex-start;background:#e2f1e6}.bubble.theirs{align-self:flex-end;background:#f0f2f5}.bubble small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.bottomnote{text-align:center;color:#89968d;font-size:11px;padding:20px}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#183f2e;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:var(--shadow);z-index:20;font-size:13px;max-width:90%;text-align:center}.login{max-width:440px;margin:45px auto;padding:22px}.login .card{padding:22px}.login h2{color:var(--green);margin-top:0}.footer-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.pagehead{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.top{padding:16px}.nav{padding:10px 12px}main{padding:4px 12px 28px}}
</style>
</head>
<body>
<div class="app" id="app">
<header class="top">
 <div class="toprow">
  <div class="brand"><div class="logo">📖</div><div><h1>رفيق الحافظ</h1><small>منصة متابعة القرآن الكريم</small></div></div>
  <button class="role-pill" onclick="showRoleSwitcher()">تبديل الحساب ▾</button>
 </div>
 <div class="userline"><div><small>مرحبًا بك</small><div id="welcome" style="font-weight:bold;margin-top:4px">مدير المركز</div></div><span class="role-pill" id="roleLabel">مدير المركز</span></div>
</header>
<nav class="nav" id="nav"></nav>
<main id="content"></main>
<div class="bottomnote">رفيق الحافظ · نموذج أولي يعمل محليًا على هذا الجهاز</div>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='rafiq_alhafiz_demo_v1';
const initial={
 role:'manager',center:'مركز رفيق الحافظ',
 teachers:[{id:'t1',name:'أحمد المعلم',username:'teacher1',password:'1234',classes:['c1']},{id:'t2',name:'محمد الهاشمي',username:'teacher2',password:'1234',classes:['c2']}],
 classes:[{id:'c1',name:'الحلقة الأولى',teacherId:'t1'},{id:'c2',name:'الحلقة الثانية',teacherId:'t2'}],
 parents:[{id:'p1',name:'ولي أمر حسام',username:'parent1',password:'1234',studentIds:['s1']},{id:'p2',name:'ولي أمر سهيل',username:'parent2',password:'1234',studentIds:['s2']}],
 students:[
 {id:'s1',name:'حسام ماجد الخياط',classId:'c1',parentId:'p1',status:'نشط'},
 {id:'s2',name:'سهيل عبدالرحمن غانم',classId:'c1',parentId:'p2',status:'نشط'},
 {id:'s3',name:'أيهم سبولة',classId:'c2',parentId:'',status:'نشط'},
 {id:'s4',name:'أسامة زيد المداني',classId:'c2',parentId:'',status:'نشط'}
 ],
 records:[
 {id:'r1',studentId:'s1',date:new Date().toISOString().slice(0,10),memorization:'سورة النبأ',verses:'1–10',revision:'جزء عمّ',score:'ممتاز',attendance:'حاضر',notes:'تسميع متقن'},
 {id:'r2',studentId:'s2',date:new Date().toISOString().slice(0,10),memorization:'سورة النازعات',verses:'1–8',revision:'سورة النبأ',score:'جيد جدًا',attendance:'حاضر',notes:''}
 ],
 comments:[],messages:[],notifications:[{id:'n1',to:'parent:p1',title:'تقرير متابعة جديد',body:'تم تسجيل متابعة حسام لهذا اليوم.',read:false,date:new Date().toISOString()}]
};
let db=load(), currentPage='dashboard', selectedStudent=null, chatParent=null;
function load(){try{return {...initial,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){return structuredClone(initial)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function uid(){return 'id'+Date.now()+Math.random().toString(16).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function roleName(){return {manager:'مدير المركز',teacher:'المعلم',parent:'ولي الأمر'}[db.role]}
function meTeacher(){return db.teachers.find(t=>t.id===db.activeTeacher)||db.teachers[0]}
function meParent(){return db.parents.find(p=>p.id===db.activeParent)||db.parents[0]}
function visibleClasses(){return db.role==='manager'?db.classes:db.classes.filter(c=>meTeacher()?.classes.includes(c.id))}
function visibleStudents(){if(db.role==='manager')return db.students;if(db.role==='teacher'){let ids=visibleClasses().map(c=>c.id);return db.students.filter(s=>ids.includes(s.classId))}return db.students.filter(s=>meParent()?.studentIds.includes(s.id))}
function studentName(id){return db.students.find(s=>s.id===id)?.name||'طالب'}
function className(id){return db.classes.find(c=>c.id===id)?.name||'—'}
function teacherName(id){return db.teachers.find(t=>t.id===id)?.name||'—'}
function navItems(){if(db.role==='manager')return [['dashboard','الرئيسية','⌂'],['students','الطلاب','👥'],['classes','الحلقات','📚'],['teachers','المعلمون','👨‍🏫'],['reports','التقارير','📊'],['notifications','الإشعارات','🔔']];if(db.role==='teacher')return [['dashboard','الرئيسية','⌂'],['students','طلابي','👥'],['daily','المتابعة اليومية','📝'],['messages','الرسائل','✉'],['notifications','الإشعارات','🔔']];return [['dashboard','الرئيسية','⌂'],['child','أبنائي','👦'],['comments','تعليقات التقارير','💬'],['messages','المحادثات','✉'],['notifications','الإشعارات','🔔']]}
function setPage(p){currentPage=p;render()}
function render(){document.getElementById('welcome').textContent=db.role==='manager'?'مدير المركز':db.role==='teacher'?meTeacher().name:meParent().name;document.getElementById('roleLabel').textContent=roleName();let items=navItems();if(!items.some(x=>x[0]===currentPage))currentPage='dashboard';document.getElementById('nav').innerHTML=items.map(x=>`<button class="${currentPage===x[0]?'active':''}" onclick="setPage('${x[0]}')">${x[2]} ${x[1]}</button>`).join('');let c=document.getElementById('content');c.innerHTML=pages[currentPage]();bindDynamic()}
function showRoleSwitcher(){let html=`<div class="card"><h3>اختيار حساب تجريبي</h3><p class="muted">اختر الدور لاستعراض الواجهات والصلاحيات.</p><div class="actions"><button class="btn" onclick="switchRole('manager')">مدير المركز</button><button class="btn" onclick="switchRole('teacher')">المعلم</button><button class="btn" onclick="switchRole('parent')">ولي الأمر</button></div><div class="notice">حسابات العرض: المعلم الأول، وولي أمر حسام. لا توجد مصادقة حقيقية في هذه النسخة.</div></div>`;document.getElementById('content').innerHTML=html}
function switchRole(r){db.role=r;db.activeTeacher=db.activeTeacher||'t1';db.activeParent=db.activeParent||'p1';save();currentPage='dashboard';render()}
function statCard(n,l,i){return `<div class="card"><div class="stat"><div><div class="num">${n}</div><small>${l}</small></div><div class="ico">${i}</div></div></div>`}
function pagesDummy(){}
const pages={
dashboard(){let ss=visibleStudents(), rec=db.records.filter(r=>ss.some(s=>s.id===r.studentId)),present=rec.filter(r=>r.attendance==='حاضر').length;let title=db.role==='manager'?'لوحة تحكم المركز':db.role==='teacher'?'لوحة المعلم':'متابعة الأبناء';return `<div class="pagehead"><div><h2>${title}</h2><div class="sub">ملخص المتابعة وإدارة البيانات</div></div><span class="badge ok">● النظام يعمل محليًا</span></div><div class="grid">${statCard(ss.length,'الطلاب','👥')}${statCard(db.role==='parent'?ss.length:visibleClasses().length,db.role==='parent'?'الأبناء':'الحلقات','📚')}${statCard(rec.length,'سجلات المتابعة','📝')}${statCard(present,'حضور مسجل','✓')}</div><div class="two section"><div class="card"><h3>آخر سجلات المتابعة</h3>${rec.slice().reverse().slice(0,5).map(r=>`<div class="item"><div class="avatar">📖</div><div class="grow"><strong>${esc(studentName(r.studentId))}</strong><small>${esc(r.memorization)} · ${esc(r.verses)} · ${esc(r.date)}</small></div><span class="badge ok">${esc(r.score)}</span></div>`).join('')||'<div class="empty">لا توجد سجلات بعد.</div>'}</div><div class="card"><h3>اختصارات</h3><div class="list">${db.role!=='parent'?`<button class="btn" onclick="setPage('daily')">＋ تسجيل متابعة يومية</button>`:''}<button class="btn secondary" onclick="setPage('${db.role==='parent'?'child':'students'}')">عرض ${db.role==='parent'?'أبنائي':'الطلاب'}</button><button class="btn secondary" onclick="setPage('notifications')">فتح الإشعارات</button></div></div></div>`},
students(){let ss=visibleStudents();return `<div class="pagehead"><div><h2>${db.role==='manager'?'إدارة الطلاب':'طلابي'}</h2><div class="sub">ملفات الطلاب وسجلاتهم</div></div>${db.role==='manager'?'<button class="btn" onclick="studentForm()">＋ إضافة طالب</button>':''}</div><input class="search" id="studentSearch" placeholder="ابحث باسم الطالب..." oninput="filterStudents()"><div class="card section" id="studentList">${studentList(ss)}</div>`},
classes(){return `<div class="pagehead"><div><h2>إدارة الحلقات</h2><div class="sub">توزيع الطلاب والمعلمين على الحلقات</div></div><button class="btn" onclick="classForm()">＋ حلقة جديدة</button></div><div class="grid">${db.classes.map(c=>`<div class="card"><div class="stat"><strong>${esc(c.name)}</strong><span class="badge">${db.students.filter(s=>s.classId===c.id).length} طلاب</span></div><p class="muted">المعلم: ${esc(teacherName(c.teacherId))}</p><button class="btn secondary small" onclick="editClass('${c.id}')">تعديل</button></div>`).join('')}</div>`},
teachers(){return `<div class="pagehead"><div><h2>إدارة المعلمين</h2><div class="sub">حساب مستقل لكل معلم وحلقاته</div></div><button class="btn" onclick="teacherForm()">＋ إضافة معلم</button></div><div class="card">${db.teachers.map(t=>`<div class="item"><div class="avatar">م</div><div class="grow"><strong>${esc(t.name)}</strong><small>اسم المستخدم: ${esc(t.username)} · ${t.classes.length} حلقة</small></div><button class="btn secondary small" onclick="editTeacher('${t.id}')">تعديل</button></div>`).join('')}</div>`},
daily(){let ss=visibleStudents();return `<div class="pagehead"><div><h2>المتابعة اليومية</h2><div class="sub">تسجيل الحفظ والمراجعة والحضور</div></div></div><div class="card"><div class="formgrid"><div class="field"><label>الطالب</label><select id="dStudent">${ss.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>التاريخ</label><input type="date" id="dDate" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>الحفظ الجديد</label><input id="dMem" placeholder="مثال: سورة النبأ"></div><div class="field"><label>من آية إلى آية</label><input id="dVerses" placeholder="1–10"></div><div class="field"><label>المراجعة</label><input id="dRev" placeholder="مثال: جزء عمّ"></div><div class="field"><label>تقييم التسميع</label><select id="dScore"><option>ممتاز</option><option>جيد جدًا</option><option>جيد</option><option>يحتاج إلى مراجعة</option></select></div><div class="field"><label>الحضور</label><select id="dAttend"><option>حاضر</option><option>غائب</option><option>متأخر</option><option>بعذر</option></select></div><div class="field"><label>ملاحظات المعلم</label><input id="dNotes" placeholder="ملاحظات اختيارية"></div></div><button class="btn" onclick="saveDaily()">حفظ المتابعة</button></div><div class="card section"><h3>سجلات اليوم</h3><div class="tablewrap"><table><thead><tr><th>الطالب</th><th>الحفظ</th><th>المراجعة</th><th>التقييم</th><th>الحضور</th></tr></thead><tbody>${db.records.filter(r=>ss.some(s=>s.id===r.studentId)).slice().reverse().slice(0,10).map(r=>`<tr><td>${esc(studentName(r.studentId))}</td><td>${esc(r.memorization)} ${esc(r.verses)}</td><td>${esc(r.revision)}</td><td>${esc(r.score)}</td><td>${esc(r.attendance)}</td></tr>`).join('')}</tbody></table></div></div>`},
reports(){let ss=visibleStudents();return `<div class="pagehead"><div><h2>التقارير والإحصائيات</h2><div class="sub">ملخص سجلات الطلاب</div></div></div><div class="grid">${statCard(ss.length,'الطلاب','👥')}${statCard(db.records.length,'كل المتابعات','📝')}${statCard(db.records.filter(r=>r.attendance==='حاضر').length,'حضور','✓')}${statCard(db.records.filter(r=>r.score==='ممتاز').length,'تقييم ممتاز','★')}</div><div class="card section"><h3>سجل المتابعة</h3><div class="tablewrap"><table><thead><tr><th>التاريخ</th><th>الطالب</th><th>الحفظ</th><th>المراجعة</th><th>التقييم</th></tr></thead><tbody>${db.records.filter(r=>ss.some(s=>s.id===r.studentId)).map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(studentName(r.studentId))}</td><td>${esc(r.memorization)} ${esc(r.verses)}</td><td>${esc(r.revision)}</td><td>${esc(r.score)}</td></tr>`).join('')}</tbody></table></div></div>`},
child(){let ss=visibleStudents();return `<div class="pagehead"><div><h2>أبنائي</h2><div class="sub">مشاهدة السجلات التعليمية فقط</div></div></div>${ss.map(s=>`<div class="card section"><div class="row"><div><strong>${esc(s.name)}</strong><div class="sub">${esc(className(s.classId))}</div></div><span class="badge ok">نشط</span></div><div class="section"><h3>سجل الحفظ والمراجعة</h3>${db.records.filter(r=>r.studentId===s.id).slice().reverse().map(r=>`<div class="item"><div class="grow"><strong>${esc(r.memorization)} ${esc(r.verses)}</strong><small>المراجعة: ${esc(r.revision)} · ${esc(r.date)}</small><small>التقييم: ${esc(r.score)} · الحضور: ${esc(r.attendance)}</small>${r.notes?`<small>ملاحظة المعلم: ${esc(r.notes)}</small>`:''}</div><button class="btn secondary small" onclick="openComment('${r.id}')">تعليق</button></div>`).join('')||'<div class="empty">لا توجد سجلات لهذا الطالب بعد.</div>'}</div></div>`).join('')}`},
comments(){let ss=visibleStudents(),ids=db.records.filter(r=>ss.some(s=>s.id===r.studentId)).map(r=>r.id);return `<div class="pagehead"><div><h2>تعليقات التقارير</h2><div class="sub">أرسل تعليقًا مرتبطًا بتقرير ابنك</div></div></div><div class="card">${db.comments.filter(x=>ids.includes(x.recordId)).map(x=>`<div class="item"><div class="grow"><strong>${esc(studentName(x.studentId))}</strong><small>${esc(x.text)}</small><small>${esc(x.date)}</small></div><span class="badge">${x.reply?'تم الرد':'بانتظار الرد'}</span></div>${x.reply?`<div class="notice">رد المعلم: ${esc(x.reply)}</div>`:''}`).join('')||'<div class="empty">لا توجد تعليقات حتى الآن. يمكنك التعليق من سجل ابنك.</div>'}</div>`},
messages(){let ss=visibleStudents();let parents=db.role==='teacher'?db.parents.filter(p=>p.studentIds.some(id=>ss.some(s=>s.id===id))):db.parents.filter(p=>p.id===meParent().id);return `<div class="pagehead"><div><h2>المحادثات</h2><div class="sub">تواصل بين ولي الأمر والمعلم</div></div></div><div class="two"><div class="card"><h3>جهات التواصل</h3>${parents.map(p=>`<button class="item" style="width:100%;background:white;text-align:right;border:0" onclick="openChat('${p.id}')"><div class="avatar">💬</div><div class="grow"><strong>${esc(p.name)}</strong><small>محادثة مع ${db.role==='teacher'?'ولي الأمر':'معلم الحلقة'}</small></div>›</button>`).join('')||'<div class="empty">لا توجد جهات اتصال.</div>'}</div><div class="card" id="chatBox"><div class="empty">اختر محادثة لعرض الرسائل.</div></div></div>`},
notifications(){let target=db.role==='parent'?'parent:'+meParent().id:db.role==='teacher'?'teacher:'+meTeacher().id:'manager';let ns=db.notifications.filter(n=>n.to===target||n.to==='all');return `<div class="pagehead"><div><h2>الإشعارات</h2><div class="sub">تنبيهات داخل التطبيق</div></div><button class="btn secondary small" onclick="markRead()">تحديد الكل كمقروء</button></div><div class="card">${ns.slice().reverse().map(n=>`<div class="item"><div class="avatar">🔔</div><div class="grow"><strong>${esc(n.title)}</strong><small>${esc(n.body)}</small><small>${new Date(n.date).toLocaleString('ar')}</small></div><span class="badge ${n.read?'':'warn'}">${n.read?'مقروء':'جديد'}</span></div>`).join('')||'<div class="empty">لا توجد إشعارات.</div>'}</div>`}
};
function studentList(ss){return ss.map(s=>`<div class="item"><div class="avatar">👤</div><div class="grow"><strong>${esc(s.name)}</strong><small>${esc(className(s.classId))} · ${esc(s.status)}</small></div><button class="btn secondary small" onclick="viewStudent('${s.id}')">الملف</button></div>`).join('')||'<div class="empty">لا يوجد طلاب.</div>'}
function filterStudents(){let q=document.getElementById('studentSearch').value;document.getElementById('studentList').innerHTML=studentList(visibleStudents().filter(s=>s.name.includes(q)))}
function viewStudent(id){selectedStudent=id;let s=db.students.find(x=>x.id===id);document.getElementById('content').innerHTML=`<div class="pagehead"><div><h2>ملف الطالب</h2><div class="sub">السجل التعليمي التفصيلي</div></div><button class="btn secondary" onclick="setPage('students')">عودة</button></div><div class="card"><h3>${esc(s.name)}</h3><p class="muted">${esc(className(s.classId))} · ${esc(s.status)}</p><div class="actions"><button class="btn" onclick="setPage('daily')">إضافة متابعة</button><button class="btn secondary" onclick="parentCommentFor('${id}')">تعليق ولي الأمر</button></div></div><div class="card section"><h3>السجل الكامل</h3>${db.records.filter(r=>r.studentId===id).map(r=>`<div class="item"><div class="grow"><strong>${esc(r.date)} · ${esc(r.memorization)} ${esc(r.verses)}</strong><small>المراجعة: ${esc(r.revision)} · ${esc(r.score)} · ${esc(r.attendance)}</small><small>${esc(r.notes)}</small></div></div>`).join('')||'<div class="empty">لا توجد متابعات.</div>'}</div>`}
function saveDaily(){let id=document.getElementById('dStudent').value;if(!id){toast('أضف طالبًا أولًا');return}let r={id:uid(),studentId:id,date:document.getElementById('dDate').value,memorization:document.getElementById('dMem').value||'—',verses:document.getElementById('dVerses').value||'—',revision:document.getElementById('dRev').value||'—',score:document.getElementById('dScore').value,attendance:document.getElementById('dAttend').value,notes:document.getElementById('dNotes').value};db.records.push(r);let s=db.students.find(x=>x.id===id);if(s?.parentId){db.notifications.push({id:uid(),to:'parent:'+s.parentId,title:'تقرير متابعة جديد',body:`تم تسجيل متابعة ${s.name}: ${r.memorization}، التقييم ${r.score}.`,read:false,date:new Date().toISOString()})}save();toast('تم حفظ المتابعة وإضافة إشعار ولي الأمر');render()}
function studentForm(){let c=db.classes[0];document.getElementById('content').innerHTML=`<div class="pagehead"><h2>إضافة طالب</h2><button class="btn secondary" onclick="setPage('students')">إلغاء</button></div><div class="card"><div class="field"><label>اسم الطالب</label><input id="newStudentName"></div><div class="field"><label>الحلقة</label><select id="newStudentClass">${db.classes.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>ولي الأمر (اختياري)</label><select id="newStudentParent"><option value="">بدون ربط</option>${db.parents.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><button class="btn" onclick="addStudent()">حفظ الطالب</button></div>`}
function addStudent(){let name=document.getElementById('newStudentName').value.trim();if(!name){toast('اكتب اسم الطالب');return}let p=document.getElementById('newStudentParent').value,s={id:uid(),name,classId:document.getElementById('newStudentClass').value,parentId:p,status:'نشط'};db.students.push(s);if(p){let par=db.parents.find(x=>x.id===p);if(!par.studentIds.includes(s.id))par.studentIds.push(s.id)}save();setPage('students');toast('تمت إضافة الطالب')}
function classForm(){document.getElementById('content').innerHTML=`<div class="pagehead"><h2>إنشاء حلقة</h2><button class="btn secondary" onclick="setPage('classes')">إلغاء</button></div><div class="card"><div class="field"><label>اسم الحلقة</label><input id="className"></div><div class="field"><label>المعلم المسؤول</label><select id="classTeacher">${db.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><button class="btn" onclick="addClass()">إنشاء الحلقة</button></div>`}
function addClass(){let name=document.getElementById('className').value.trim(),tid=document.getElementById('classTeacher').value;if(!name)return toast('اكتب اسم الحلقة');let id=uid();db.classes.push({id,name,teacherId:tid});let t=db.teachers.find(x=>x.id===tid);if(t&&!t.classes.includes(id))t.classes.push(id);save();setPage('classes');toast('تم إنشاء الحلقة')}
function editClass(id){let c=db.classes.find(x=>x.id===id);document.getElementById('content').innerHTML=`<div class="pagehead"><h2>تعديل الحلقة</h2><button class="btn secondary" onclick="setPage('classes')">عودة</button></div><div class="card"><div class="field"><label>اسم الحلقة</label><input id="editClassName" value="${esc(c.name)}"></div><div class="field"><label>المعلم</label><select id="editClassTeacher">${db.teachers.map(t=>`<option value="${t.id}" ${c.teacherId===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><button class="btn" onclick="updateClass('${id}')">حفظ التعديلات</button></div>`}
function updateClass(id){let c=db.classes.find(x=>x.id===id),tid=document.getElementById('editClassTeacher').value;c.name=document.getElementById('editClassName').value.trim();c.teacherId=tid;db.teachers.forEach(t=>t.classes=t.classes.filter(x=>x!==id));db.teachers.find(t=>t.id===tid)?.classes.push(id);save();setPage('classes');toast('تم تحديث الحلقة')}
function teacherForm(){document.getElementById('content').innerHTML=`<div class="pagehead"><h2>إضافة معلم</h2><button class="btn secondary" onclick="setPage('teachers')">إلغاء</button></div><div class="card"><div class="field"><label>اسم المعلم</label><input id="tn"></div><div class="field"><label>اسم المستخدم</label><input id="tu"></div><div class="field"><label>كلمة مرور تجريبية</label><input id="tp" value="1234"></div><button class="btn" onclick="addTeacher()">إنشاء الحساب</button></div>`}
function addTeacher(){let name=document.getElementById('tn').value.trim(),username=document.getElementById('tu').value.trim();if(!name||!username)return toast('أكمل البيانات');db.teachers.push({id:uid(),name,username,password:document.getElementById('tp').value,classes:[]});save();setPage('teachers');toast('تم إنشاء حساب المعلم')}
function editTeacher(id){let t=db.teachers.find(x=>x.id===id);document.getElementById('content').innerHTML=`<div class="pagehead"><h2>تعديل المعلم</h2><button class="btn secondary" onclick="setPage('teachers')">عودة</button></div><div class="card"><div class="field"><label>الاسم</label><input id="etn" value="${esc(t.name)}"></div><div class="field"><label>اسم المستخدم</label><input id="etu" value="${esc(t.username)}"></div><button class="btn" onclick="updateTeacher('${id}')">حفظ</button></div>`}
function updateTeacher(id){let t=db.teachers.find(x=>x.id===id);t.name=document.getElementById('etn').value;t.username=document.getElementById('etu').value;save();setPage('teachers');toast('تم تحديث المعلم')}
function openComment(recordId){let r=db.records.find(x=>x.id===recordId);document.getElementById('content').innerHTML=`<div class="pagehead"><h2>تعليق على التقرير</h2><button class="btn secondary" onclick="setPage('child')">عودة</button></div><div class="card"><p><b>${esc(studentName(r.studentId))}</b> · ${esc(r.memorization)} ${esc(r.verses)}</p><div class="field"><label>اكتب تعليقك أو استفسارك</label><textarea id="commentText" placeholder="اكتب رسالتك للمعلم..."></textarea></div><button class="btn" onclick="sendComment('${recordId}')">إرسال التعليق</button></div>`}
function parentCommentFor(studentId){let r=db.records.find(x=>x.studentId===studentId);if(!r){toast('لا يوجد تقرير للتعليق عليه بعد');return}openComment(r.id)}
function sendComment(rid){let text=document.getElementById('commentText').value.trim();if(!text)return toast('اكتب التعليق أولًا');let r=db.records.find(x=>x.id===rid),s=db.students.find(x=>x.id===r.studentId);db.comments.push({id:uid(),recordId:rid,studentId:s.id,text,reply:'',date:new Date().toLocaleString('ar')});let cl=db.classes.find(c=>c.id===s.classId);db.notifications.push({id:uid(),to:cl?'teacher:'+cl.teacherId:'manager',title:'تعليق جديد من ولي أمر',body:`تعليق بخصوص ${s.name}: ${text}`,read:false,date:new Date().toISOString()});save();setPage('comments');toast('تم إرسال التعليق للمعلم')}
function openChat(parentId){chatParent=parentId;let p=db.parents.find(x=>x.id===parentId);let box=document.getElementById('chatBox');let msgs=db.messages.filter(m=>m.parentId===parentId);box.innerHTML=`<h3>محادثة: ${esc(p.name)}</h3><div class="chat" id="chatMessages">${msgs.map(m=>`<div class="bubble ${m.from===db.role?'mine':'theirs'}">${esc(m.text)}<small>${esc(m.sender)} · ${esc(m.date)}</small></div>`).join('')||'<div class="empty">ابدأ المحادثة برسالة جديدة.</div>'}</div><div class="field"><textarea id="chatInput" placeholder="اكتب رسالتك..."></textarea></div><button class="btn" onclick="sendMessage()">إرسال الرسالة</button>`}
function sendMessage(){let text=document.getElementById('chatInput').value.trim();if(!text)return toast('اكتب رسالة');let pId=db.role==='parent'?meParent().id:chatParent;if(!pId)return;let sender=db.role==='parent'?meParent().name:meTeacher().name;db.messages.push({id:uid(),parentId:pId,from:db.role,text,sender,date:new Date().toLocaleString('ar')});let target=db.role==='parent'?'teacher:'+((db.classes.find(c=>db.students.some(s=>s.parentId===pId&&s.classId===c.id))||{}).teacherId||''):'parent:'+pId;db.notifications.push({id:uid(),to:target,title:'رسالة جديدة',body:`${sender}: ${text}`,read:false,date:new Date().toISOString()});save();render();if(db.role==='teacher')openChat(pId);else openChat(pId);toast('تم إرسال الرسالة')}
function markRead(){let target=db.role==='parent'?'parent:'+meParent().id:db.role==='teacher'?'teacher:'+meTeacher().id:'manager';db.notifications.forEach(n=>{if(n.to===target||n.to==='all')n.read=true});save();render();toast('تم تحديث الإشعارات')}
function bindDynamic(){}
function resetDemo(){if(confirm('سيتم حذف بيانات التجربة وإعادتها إلى البداية. هل تريد المتابعة؟')){localStorage.removeItem(KEY);db=load();currentPage='dashboard';render();toast('تمت إعادة بيانات العرض')}}
render();
</script>
</body>
</html>
